# Coolify production deployment for Agent Swarm (Seamless Agency fork).
#
# Adapted from docker-compose.example.yml for Coolify's Docker Compose build pack:
#  - No host port mappings: services talk over Coolify's isolated per-app network
#    (http://api:3013, http://agent-fs:7433, http://minio:9000) and only the API
#    is published, via Coolify's proxy (SERVICE_FQDN_API_3013 below).
#  - SECRETS_ENCRYPTION_KEY is provided as an env var from Coolify instead of a
#    mounted secret file (supported fallback per upstream compose comments).
#    BACK UP this key together with the swarm_api volume (SQLite DB) — losing it
#    means losing all encrypted swarm secrets.
#  - MinIO credentials come from env vars instead of hardcoded minioadmin.
#  - Starts with lead + 2 coder workers; add specialists later by copying a
#    worker block (new AGENT_ID UUID + personal volume).
#
# All ${VARS} are managed in Coolify (Environment Variables tab).

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agent-swarm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - agent_fs_minio:/data
    expose:
      - "9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agent-swarm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/agentfs

  agent-fs:
    image: ghcr.io/desplega-ai/agent-fs:0.12.2
    platform: linux/amd64
    pull_policy: always
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      - AGENT_FS_HOME=/data
      - HOST=0.0.0.0
      - SERVER_HOST=0.0.0.0
      - PORT=7433
      - SERVER_PORT=7433
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=${AGENT_FS_S3_PUBLIC_ENDPOINT:-}
      - S3_BUCKET=agentfs
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-agent-swarm}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_REGION=us-east-1
      - S3_PROVIDER=minio
      - EMBEDDING_PROVIDER=${AGENT_FS_EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${AGENT_FS_EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${AGENT_FS_EMBEDDING_API_KEY:-}
    volumes:
      - agent_fs_data:/data
    expose:
      - "7433"
    healthcheck:
      # The agent-fs image ships node/bun but no curl/wget; probe with node fetch.
      # Generous retries: first boot downloads the local embedding model before listening.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7433/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    image: ghcr.io/desplega-ai/agent-swarm:latest
    platform: linux/amd64
    pull_policy: always
    stop_grace_period: 60s
    depends_on:
      agent-fs:
        condition: service_healthy
    environment:
      # Coolify magic var: assigns the app's public domain to this service, port 3013.
      - SERVICE_FQDN_API_3013
      - API_KEY=${API_KEY}
      - RBAC_ENABLED=${RBAC_ENABLED:-false}
      - AGENT_FS_API_URL=http://agent-fs:7433
      - API_AGENT_FS_API_KEY=${API_AGENT_FS_API_KEY:-}
      - AGENT_FS_REGISTER_EMAIL=${AGENT_FS_REGISTER_EMAIL:-swarm-admin@agent-fs.local}
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY}
      - MCP_BASE_URL=${PUBLIC_MCP_BASE_URL}
      - PUBLIC_MCP_BASE_URL=${PUBLIC_MCP_BASE_URL}
      - APP_URL=${APP_URL:-https://app.agent-swarm.dev}
      - SLACK_DISABLE=${SLACK_DISABLE:-true}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
    volumes:
      - swarm_api:/app
    expose:
      - "3013"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:3013/health || wget -q --spider http://localhost:3013/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  lead:
    image: ghcr.io/desplega-ai/agent-swarm-worker:latest
    platform: linux/amd64
    pull_policy: always
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - API_KEY=${API_KEY}
      # Keep stable across restarts: agent identity + task resume depend on it.
      - AGENT_ID=${LEAD_AGENT_ID}
      - AGENT_ROLE=lead
      - TEMPLATE_ID=official/lead
      - MCP_BASE_URL=http://api:3013
      - AGENT_FS_API_URL=http://agent-fs:7433
      - YOLO=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_EMAIL=${GITHUB_EMAIL:-}
      - GITHUB_NAME=${GITHUB_NAME:-}
    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_lead:/workspace/personal
    restart: unless-stopped

  worker-1:
    image: ghcr.io/desplega-ai/agent-swarm-worker:latest
    platform: linux/amd64
    pull_policy: always
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - API_KEY=${API_KEY}
      # Keep stable across restarts: agent identity + task resume depend on it.
      - AGENT_ID=${WORKER_1_AGENT_ID}
      - AGENT_ROLE=worker
      - TEMPLATE_ID=official/coder
      - MCP_BASE_URL=http://api:3013
      - AGENT_FS_API_URL=http://agent-fs:7433
      - YOLO=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_EMAIL=${GITHUB_EMAIL:-}
      - GITHUB_NAME=${GITHUB_NAME:-}
    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_worker_1:/workspace/personal
    restart: unless-stopped

  worker-2:
    image: ghcr.io/desplega-ai/agent-swarm-worker:latest
    platform: linux/amd64
    pull_policy: always
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - API_KEY=${API_KEY}
      # Keep stable across restarts: agent identity + task resume depend on it.
      - AGENT_ID=${WORKER_2_AGENT_ID}
      - AGENT_ROLE=worker
      - TEMPLATE_ID=official/coder
      - MCP_BASE_URL=http://api:3013
      - AGENT_FS_API_URL=http://agent-fs:7433
      - YOLO=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_EMAIL=${GITHUB_EMAIL:-}
      - GITHUB_NAME=${GITHUB_NAME:-}
    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_worker_2:/workspace/personal
    restart: unless-stopped

volumes:
  agent_fs_minio:
  agent_fs_data:
  swarm_api:
  swarm_logs:
  swarm_shared:
  swarm_lead:
  swarm_worker_1:
  swarm_worker_2:
